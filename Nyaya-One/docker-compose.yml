services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nyaya
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: nyaya_dev_only
    ports: ["5432:5432"]
    volumes: [nyaya_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaya -d nyaya"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nyaya:nyaya_dev_only@db:5432/nyaya
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "nyaya_uploads:/app/storage"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  nyaya_pgdata:
  nyaya_uploads:
